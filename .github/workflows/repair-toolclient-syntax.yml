name: Repair ToolClient syntax

on:
  push:
    branches:
      - 'arena/**'
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair known syntax error
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/tools/[slug]/ToolClient.js')
          s = p.read_text()
          old = "setO(c.toDataURL('image/jpeg',Number(q)||0.7)};"
          new = "setO(c.toDataURL('image/jpeg',Number(q)||0.7));"
          if old not in s:
              print('No known syntax error found; nothing to repair.')
              raise SystemExit(0)
          p.write_text(s.replace(old, new, 1))
          print('Repaired ToolClient.js syntax.')
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/tools/[slug]/ToolClient.js'
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair image compressor syntax'
          git push
