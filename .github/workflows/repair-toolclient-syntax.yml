name: Repair ToolClient syntax

on:
  push:
    branches:
      - 'arena/**'
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair ToolClient syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/tools/[slug]/ToolClient.js')
          s = p.read_text()
          changed = False
          patterns = [
              ("setO(c.toDataURL('image/jpeg',Number(q)||0.7)};im.src=URL.createObjectURL(f)}return", "setO(c.toDataURL('image/jpeg',Number(q)||0.7));};im.src=URL.createObjectURL(f)}return"),
              ("setO(c.toDataURL('image/jpeg',Number(q)||0.7)};", "setO(c.toDataURL('image/jpeg',Number(q)||0.7));"),
          ]
          for old, new in patterns:
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
          if changed:
              p.write_text(s)
              print('Repaired ToolClient.js.')
          else:
              print('No known ToolClient.js repair needed.')
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/tools/[slug]/ToolClient.js'
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair image compressor callback'
          git push
