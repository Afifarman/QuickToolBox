name: Auto-Fix Agent Validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'feat/ai-auto-fix-agent'
      - 'fix/auto-*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_SITE_URL: https://quick-tool-box-gfr1.vercel.app
