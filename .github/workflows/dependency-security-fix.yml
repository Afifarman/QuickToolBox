name: Dependency Security Fix

on:
  push:
    branches:
      - fix/dependency-security-2026-10

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade Next.js safely
        run: npm install next@16.3.6 --save-exact
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
      - name: Commit dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "security: update Next.js to patched release"
          git push
