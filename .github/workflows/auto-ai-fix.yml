name: Auto AI Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

# This workflow may create a repair branch and PR, but it must never push a repair
# directly to main. Production remains protected by the normal PR/build/approval flow.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-ai-fix-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  build:
    name: Detect build failure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      failed: ${{ steps.status.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build
        id: build
        continue-on-error: true
        run: npm run build 2>&1 | tee build.log
      - name: Save status
        id: status
        run: echo "failed=${{ steps.build.outcome == 'failure' }}" >> "$GITHUB_OUTPUT"
      - name: Upload build log
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Report build result
        run: |
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "Build failed; Auto AI Fix will attempt a repair PR."
          else
            echo "Build passed; no AI repair is needed."
          fi

  ai-fix:
    name: AI repair PR
    needs: build
    if: needs.build.outputs.failed == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download build log
        uses: actions/download-artifact@v4
        with:
          name: build-log
      - name: Install dependencies
        run: npm ci
      - name: Create repair branch
        id: branch
        run: |
          BRANCH="ai-fix/${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Ask AI for a minimal patch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo 'OPENAI_API_KEY secret is required'; exit 1; }
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          log=Path('build.log').read_text(errors='replace')[-30000:]
          files=subprocess.check_output(['git','ls-files']).decode()
          prompt=f'''You are a cautious software repair agent for a Next.js repository.
          Fix ONLY the build error shown below. Do not change secrets, workflows, authentication policy, deployment settings, or unrelated behavior.
          Inspect the repository files. Return ONLY a unified git diff that can be applied with `git apply`.
          If you cannot make a safe minimal fix, return the exact text: NO_SAFE_FIX.

          BUILD ERROR:
          {log}

          TRACKED FILES:
          {files}
          '''
          body={'model':'gpt-5-mini','input':prompt,'max_output_tokens':12000}
          import urllib.request
          req=urllib.request.Request('https://api.openai.com/v1/responses',data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['OPENAI_API_KEY'],'Content-Type':'application/json'})
          with urllib.request.urlopen(req) as r: data=json.load(r)
          text=''.join(x.get('text','') for o in data.get('output',[]) for x in o.get('content',[]) if x.get('type')=='output_text').strip()
          Path('ai.patch').write_text(text)
          PY
          if grep -q '^NO_SAFE_FIX' ai.patch; then echo 'AI reported no safe fix'; exit 1; fi
          sed -i '/^```diff$/d;/^```$/d' ai.patch
          git apply --check ai.patch
          git apply ai.patch
      - name: Verify repair
        run: npm run build
      - name: Commit and push repair branch only
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          git config user.name 'QuickToolBox Auto-Fix Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m 'fix: automated AI repair'
          git push --set-upstream origin "$BRANCH"
      - name: Open repair PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          gh pr create --base main --head "$BRANCH" --title 'fix: automated AI repair' --body $'Automated repair generated by QuickToolBox Auto AI Fix.\n\n- Main build failed.\n- AI generated a minimal patch.\n- The repair branch passed `npm run build`.\n- Human approval is required before merge.\n- No production deployment is performed by this workflow.'
